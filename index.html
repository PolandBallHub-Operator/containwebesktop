<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3F51B5">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<script src="./sw.js"></script>
<style>[hidden]{display:none!important}:root{color-scheme:light}</style>
<title>WebContainer Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" crossorigin="anonymous">
<style>
/* レイアウト: 全面デスクトップ(壁紙) + 下端48dpタスクバー。ウィンドウは絶対配置、Material Design 1 の立体感は z-depth シャドウで表現 */
:root{
  --primary:#3F51B5; --primary-d:#303F9F; --accent:#FF4081;
  --bg:#FAFAFA; --card:#FFFFFF; --bar:#F0F0F2; --code-bg:#FFFFFF;
  --text:rgba(0,0,0,.87); --text2:rgba(0,0,0,.58); --text3:rgba(0,0,0,.38);
  --divider:rgba(0,0,0,.12); --hover:rgba(0,0,0,.06);
  --pt:var(--primary-d); --title-off:#8E8E93;
  --sel:color-mix(in srgb,var(--primary) 16%,transparent);
  --z1:0 1px 3px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.24);
  --z2:0 3px 6px rgba(0,0,0,.16),0 3px 6px rgba(0,0,0,.23);
  --z3:0 10px 20px rgba(0,0,0,.19),0 6px 6px rgba(0,0,0,.23);
  --z4:0 14px 28px rgba(0,0,0,.25),0 10px 10px rgba(0,0,0,.22);
  --z5:0 19px 38px rgba(0,0,0,.30),0 15px 12px rgba(0,0,0,.22);
  --c-kw:#7B1FA2; --c-str:#2E7D32; --c-num:#E65100; --c-com:#78909C; --c-fn:#1565C0; --c-tag:#C2185B; --c-attr:#EF6C00; --c-key:#1565C0;
  --anim:220ms;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#303030; --card:#424242; --bar:#383838; --code-bg:#2B2B2B;
  --text:rgba(255,255,255,.9); --text2:rgba(255,255,255,.7); --text3:rgba(255,255,255,.5);
  --divider:rgba(255,255,255,.12); --hover:rgba(255,255,255,.08);
  --pt:color-mix(in srgb,var(--primary) 55%,#fff); --title-off:#616161;
  --c-kw:#CE93D8; --c-str:#A5D6A7; --c-num:#FFCC80; --c-com:#90A4AE; --c-fn:#90CAF9; --c-tag:#F48FB1; --c-attr:#FFCC80; --c-key:#90CAF9;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#303030; --card:#424242; --bar:#383838; --code-bg:#2B2B2B;
  --text:rgba(255,255,255,.9); --text2:rgba(255,255,255,.7); --text3:rgba(255,255,255,.5);
  --divider:rgba(255,255,255,.12); --hover:rgba(255,255,255,.08);
  --pt:color-mix(in srgb,var(--primary) 55%,#fff); --title-off:#616161;
  --c-kw:#CE93D8; --c-str:#A5D6A7; --c-num:#FFCC80; --c-com:#90A4AE; --c-fn:#90CAF9; --c-tag:#F48FB1; --c-attr:#FFCC80; --c-key:#90CAF9;
  color-scheme:dark}
@media (prefers-reduced-motion:reduce){:root{--anim:0ms!important}}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 'Roboto','Noto Sans JP',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
input,textarea,select{user-select:text;-webkit-user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
svg{display:block;flex:none}
#os{position:relative;height:100%;overflow:hidden}
#desktop{position:absolute;inset:0 0 48px 0;overflow:hidden;background:#3F51B5}
#icons{position:absolute;inset:0;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,100px);grid-auto-columns:92px;align-content:start;justify-content:start;gap:4px;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
#windows{position:absolute;inset:0;pointer-events:none}

/* デスクトップアイコン */
.dicon{width:88px;height:96px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border:1px solid transparent;border-radius:4px;background:none;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.65)}
.dicon:hover{background:rgba(255,255,255,.14)}
.dicon.sel{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.45)}
.dicon .dc{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:var(--z2);text-shadow:none}
.dicon .dl{font-size:12px;line-height:1.2;text-align:center;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}

/* ウィンドウ */
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;min-width:320px;min-height:200px;background:var(--bg);border-radius:2px;box-shadow:var(--z2);transition:opacity var(--anim) ease,transform var(--anim) ease,box-shadow var(--anim) ease}
.win.anim{transition:opacity var(--anim) ease,transform var(--anim) ease,box-shadow var(--anim) ease,left var(--anim) ease,top var(--anim) ease,width var(--anim) ease,height var(--anim) ease}
.win.focused{box-shadow:var(--z5)}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;min-width:0}
.win.min{opacity:0;transform:translateY(48px) scale(.9);visibility:hidden;pointer-events:none;transition:opacity var(--anim) ease,transform var(--anim) ease,visibility 0s linear var(--anim)}
.win.opening{animation:win-in var(--anim) cubic-bezier(.2,.8,.2,1)}
.win.closing{animation:win-out var(--anim) ease forwards;pointer-events:none}
@keyframes win-in{from{opacity:0;transform:scale(.92) translateY(14px)}to{opacity:1;transform:none}}
@keyframes win-out{to{opacity:0;transform:scale(.94)}}
.wtitle{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 4px 0 12px;background:var(--title-off);color:#fff;border-radius:2px 2px 0 0;touch-action:none;cursor:default}
.win.focused .wtitle{background:var(--primary)}
.win.max .wtitle{border-radius:0}
.wtitle .wt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;font-size:14px;letter-spacing:.01em}
.wbtn{width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:#fff;display:grid;place-items:center}
.wbtn:hover{background:rgba(255,255,255,.22)}
.wbtn.x:hover{background:#E53935}
.win-body{flex:1;min-height:0;position:relative;overflow:hidden;container-type:inline-size}
.rh{position:absolute;z-index:3;touch-action:none}
.rh[data-d=n]{top:-3px;left:10px;right:10px;height:6px;cursor:ns-resize}
.rh[data-d=s]{bottom:-3px;left:10px;right:10px;height:6px;cursor:ns-resize}
.rh[data-d=e]{right:-3px;top:10px;bottom:10px;width:6px;cursor:ew-resize}
.rh[data-d=w]{left:-3px;top:10px;bottom:10px;width:6px;cursor:ew-resize}
.rh[data-d=ne]{top:-4px;right:-4px;width:14px;height:14px;cursor:nesw-resize}
.rh[data-d=nw]{top:-4px;left:-4px;width:14px;height:14px;cursor:nwse-resize}
.rh[data-d=se]{bottom:-4px;right:-4px;width:14px;height:14px;cursor:nwse-resize}
.rh[data-d=sw]{bottom:-4px;left:-4px;width:14px;height:14px;cursor:nesw-resize}
.win.max .rh{display:none}
body.dragging .win-body{pointer-events:none}

/* タスクバー */
#taskbar{position:absolute;left:0;right:0;bottom:0;height:48px;display:flex;align-items:center;gap:8px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:var(--primary-d);color:#fff;box-shadow:0 -2px 6px rgba(0,0,0,.28);z-index:5000}
.start-btn{width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:#fff;display:grid;place-items:center;flex:none}
.start-btn:hover,.start-btn[aria-expanded=true]{background:rgba(255,255,255,.18)}
#tasks{flex:1;min-width:0;display:flex;gap:4px;overflow:hidden}
.task{height:40px;max-width:180px;min-width:40px;padding:0 12px;border:0;border-bottom:3px solid transparent;border-radius:2px;background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;gap:8px;flex:0 1 auto}
.task:hover{background:rgba(255,255,255,.2)}
.task.active{background:rgba(255,255,255,.22);border-bottom-color:var(--accent)}
.task.dim{opacity:.65}
.task-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
#tray{display:flex;align-items:center;gap:8px;flex:none}
.chip{height:32px;padding:0 12px 0 8px;border:0;border-radius:16px;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;white-space:nowrap}
.chip:hover{background:rgba(255,255,255,.24)}
.dot{width:10px;height:10px;border-radius:50%;background:#FFB300;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.dot.ok{background:#69F0AE}.dot.fb{background:#FFAB40}
#clock{height:40px;padding:0 8px;border:0;background:transparent;color:#fff;text-align:right;line-height:1.2;font-variant-numeric:tabular-nums}
#clock b{display:block;font-size:14px;font-weight:500}
#clock small{display:block;font-size:11px;opacity:.85}
@media (max-width:760px){.chip .ct,.task-t{display:none}.chip{padding:0 8px}}
.start{position:absolute;left:8px;bottom:56px;width:300px;max-width:calc(100% - 16px);background:var(--card);border-radius:2px;box-shadow:var(--z4);z-index:4999;transform-origin:bottom left;animation:pop var(--anim) cubic-bezier(.2,.8,.2,1);overflow:hidden}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.start-h{background:var(--primary);color:#fff;padding:20px 16px 14px;min-height:88px;display:flex;flex-direction:column;justify-content:flex-end}
.start-h b{font-size:20px;font-weight:500}.start-h span{font-size:12px;opacity:.85}
.start-l{padding:8px 0}

/* 共通部品 */
.btn,.icon-btn,.mi,.nav-i,.task,.start-btn,.fab,.sw,.crumb{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);animation:rip 520ms ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.rip{display:none}}
.icon-btn{width:36px;height:36px;flex:none;border:0;border-radius:50%;background:transparent;color:var(--text2);display:grid;place-items:center}
.icon-btn:hover:not(:disabled){background:var(--hover);color:var(--text)}
.icon-btn:disabled{opacity:.35;cursor:default}
.btn{height:36px;padding:0 16px;border:0;border-radius:2px;background:transparent;color:var(--pt);font-weight:500;letter-spacing:.03em;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--hover)}
.btn:disabled{opacity:.4;cursor:default}
.btn.raised{background:var(--card);box-shadow:var(--z1);color:var(--text)}
.btn.raised:hover:not(:disabled){box-shadow:var(--z2);background:var(--card)}
.btn.primary{background:var(--primary);color:#fff;box-shadow:var(--z1)}
.btn.primary:hover:not(:disabled){background:var(--primary);box-shadow:var(--z2);filter:brightness(1.06)}
.btn.accent{color:var(--accent)}
.btn.danger{color:#E53935}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.tf{width:100%;height:36px;border:0;border-bottom:1px solid var(--text3);border-radius:0;background:transparent;padding:4px 2px;outline:0;min-width:0}
.tf:focus{border-bottom:2px solid var(--primary);padding-bottom:3px}
.tf.bad{border-bottom:2px solid #E53935}
.tf-err{color:#E53935;font-size:12px;min-height:18px;padding-top:4px}
select.tf{appearance:auto;cursor:pointer;background:var(--card)}
.ctx{position:fixed;z-index:9000;min-width:200px;max-width:90vw;background:var(--card);border-radius:2px;box-shadow:var(--z3);padding:8px 0;animation:fade var(--anim) ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mi{display:flex;align-items:center;gap:16px;width:100%;height:40px;padding:0 16px;border:0;background:transparent;color:var(--text);text-align:left;white-space:nowrap}
.mi:hover:not(:disabled){background:var(--hover)}
.mi:disabled{color:var(--text3);cursor:default}
.mi-ic{width:20px;display:grid;place-items:center;color:var(--text2)}
.msep{height:1px;background:var(--divider);margin:8px 0}
#modal{position:relative;z-index:9500}
.scrim{position:fixed;inset:0;z-index:9500;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.5);animation:fade var(--anim) ease}
.dlg{width:min(480px,100%);max-height:90vh;display:flex;flex-direction:column;background:var(--card);border-radius:2px;box-shadow:var(--z5);padding:24px 24px 8px;animation:pop var(--anim) cubic-bezier(.2,.8,.2,1)}
.dlg h2{margin:0 0 16px;font-size:20px;font-weight:500}
.dlg-b{overflow:auto;color:var(--text2);min-height:0}
.dlg-b p{margin:0 0 8px}
.dlg-a{display:flex;justify-content:flex-end;gap:8px;padding:16px 0 8px;flex-wrap:wrap}
.pick{max-height:300px;overflow:auto;margin-top:8px}
.pick .mi{height:36px;font-size:13px}.pk-n{overflow:hidden;text-overflow:ellipsis}
.empty-s{padding:16px;text-align:center;color:var(--text3)}
#toasts{position:fixed;left:16px;bottom:64px;z-index:9600;pointer-events:none}
.toast{background:#323232;color:#fff;padding:13px 24px;border-radius:2px;box-shadow:var(--z3);max-width:min(420px,calc(100vw - 32px));animation:toast-in var(--anim) ease}
@keyframes toast-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fab{position:absolute;right:20px;bottom:20px;width:56px;height:56px;border:0;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:var(--z3);z-index:2;transition:box-shadow var(--anim)}
.fab:hover{box-shadow:var(--z4)}.fab:active{box-shadow:var(--z5)}
.drop{outline:2px dashed var(--primary);outline-offset:-2px;background:var(--sel)!important}

/* ファイルマネージャー */
.fm{display:flex;flex-direction:column;height:100%}
.tbar{display:flex;align-items:center;gap:2px;min-height:48px;padding:6px 8px;background:var(--card);box-shadow:var(--z1);position:relative;z-index:1;flex:none}
.tbar .sp{flex:1;min-width:0}
.tbar .vs{width:1px;height:24px;background:var(--divider);margin:0 6px;flex:none}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;overflow:hidden;margin:0 6px;height:36px;background:var(--bar);border-radius:2px;padding:0 4px}
.crumb{border:0;background:transparent;border-radius:2px;height:28px;padding:0 8px;color:var(--text2);white-space:nowrap;flex:none}
.crumb:hover{background:var(--hover)}.crumb:last-child{color:var(--text);font-weight:500}
.cs{color:var(--text3);flex:none}
.fm-main{flex:1;display:flex;min-height:0;position:relative}
.fm-tree{width:200px;flex:none;overflow:auto;padding:8px 0;background:var(--bar);border-right:1px solid var(--divider)}
@container (max-width:560px){.fm-tree{display:none}}
.tr{display:flex;align-items:center;gap:4px;height:32px;padding-right:8px;white-space:nowrap;cursor:pointer;color:var(--text)}
.tr:hover{background:var(--hover)}.tr.cur{background:var(--sel);color:var(--pt);font-weight:500}
.tr .tc{width:20px;height:20px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--text2);padding:0}
.tr .tn{overflow:hidden;text-overflow:ellipsis}
.fl{flex:1;min-width:0;overflow:auto;background:var(--card);padding-bottom:88px}
.fr{display:grid;grid-template-columns:minmax(0,1fr) 88px 130px;align-items:center;gap:12px;height:40px;padding:0 16px;border-bottom:1px solid var(--divider);cursor:default}
.fr.fh{position:sticky;top:0;z-index:1;background:var(--card);height:36px;font-size:12px;font-weight:500;color:var(--text2);letter-spacing:.04em}
.fr[data-name]:hover{background:var(--hover)}
.fr.sel{background:var(--sel)}
.fr .fn{display:flex;align-items:center;gap:12px;min-width:0}
.fr .fn span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr .fs,.fr .ft{color:var(--text2);font-size:13px;white-space:nowrap}.fr .fs{text-align:right;font-variant-numeric:tabular-nums}
@container (max-width:520px){.fr{grid-template-columns:minmax(0,1fr) 76px}.fr .ft{display:none}}
.fl-empty{padding:48px 16px;text-align:center;color:var(--text3)}
.sbar{display:flex;gap:16px;align-items:center;height:26px;padding:0 16px;flex:none;background:var(--bar);border-top:1px solid var(--divider);font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden}
.sbar .sp{flex:1}

/* エディタ */
.ed{display:flex;flex-direction:column;height:100%}
.ed-p{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:13px;color:var(--text2);overflow:hidden;white-space:nowrap}
.ed-p b{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.ed-p i{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.ed-main{flex:1;min-height:0;display:flex;background:var(--code-bg);position:relative}
.gut,.code pre,.code textarea{font:13px/20px 'Roboto Mono',ui-monospace,Menlo,Consolas,monospace;tab-size:2;letter-spacing:0}
.gut{width:52px;flex:none;overflow:hidden;white-space:pre;text-align:right;padding:8px 10px 8px 0;color:var(--text3);background:var(--bar);border-right:1px solid var(--divider)}
.code{position:relative;flex:1;min-width:0}
.code pre,.code textarea{position:absolute;inset:0;margin:0;padding:8px 12px;border:0;white-space:pre;word-spacing:0}
.code pre{overflow:hidden;pointer-events:none;color:var(--text)}
.code textarea{overflow:auto;resize:none;outline:0;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--text)}
.code textarea::selection{background:color-mix(in srgb,var(--primary) 32%,transparent);-webkit-text-fill-color:transparent}
.t-kw{color:var(--c-kw)}.t-str{color:var(--c-str)}.t-num{color:var(--c-num)}.t-com{color:var(--c-com);font-style:italic}.t-fn{color:var(--c-fn)}.t-tag{color:var(--c-tag)}.t-attr{color:var(--c-attr)}.t-key{color:var(--c-key)}
.ed-empty{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;background:var(--code-bg);color:var(--text2);z-index:2;text-align:center;padding:16px}
.ed-out{flex:none;height:150px;display:flex;flex-direction:column;background:#212121;color:#E0E0E0;border-top:1px solid var(--divider)}
.ed-out header{display:flex;align-items:center;gap:8px;height:30px;padding:0 4px 0 12px;background:#2C2C2C;font-size:12px;color:#B0BEC5;flex:none}
.ed-out header span{flex:1}.ed-out header .icon-btn{color:#B0BEC5;width:28px;height:28px}
.ed-out pre{flex:1;margin:0;padding:8px 12px;overflow:auto;font:12px/1.5 'Roboto Mono',ui-monospace,monospace;user-select:text;-webkit-user-select:text;white-space:pre-wrap;word-break:break-word}
.ed-out pre .er{color:#FF8A80}

/* フォトビューア */
.pv{display:flex;flex-direction:column;height:100%}
.pv-main{flex:1;min-height:0;display:flex}
.pv-stage{flex:1;min-width:0;position:relative;overflow:hidden;background:#212121;cursor:grab;touch-action:none}
.pv-stage.pan{cursor:grabbing}
.pv-stage img{position:absolute;left:50%;top:50%;max-width:none;transform-origin:center;user-select:none;-webkit-user-drag:none;box-shadow:0 2px 12px rgba(0,0,0,.5)}
.pv-msg{position:absolute;inset:0;display:grid;place-items:center;color:#B0BEC5;padding:16px;text-align:center}
.pv-info{width:240px;flex:none;overflow:auto;background:var(--card);border-left:1px solid var(--divider);padding:8px 0}
@container (max-width:560px){.pv-info{display:none}}
.pv-info dl{margin:0}.pv-info dt{padding:10px 16px 0;font-size:12px;color:var(--text2)}.pv-info dd{margin:0;padding:2px 16px 6px;word-break:break-all;font-size:13px}
.pv-z{min-width:52px;text-align:center;color:var(--text2);font-size:13px;font-variant-numeric:tabular-nums}
.gal{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:min-content;gap:12px;padding:16px;background:var(--bg)}
.gi{border:0;padding:0;background:var(--card);border-radius:2px;box-shadow:var(--z1);overflow:hidden;text-align:left;transition:box-shadow var(--anim)}
.gi:hover{box-shadow:var(--z3)}
.gi img{width:100%;height:110px;object-fit:cover;display:block;background:#CFD8DC}
.gi span{display:block;padding:8px 12px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 設定 */
.st{display:flex;height:100%}
.st-nav{width:184px;flex:none;background:var(--bar);border-right:1px solid var(--divider);padding:8px 0;overflow:auto}
@container (max-width:540px){.st-nav{width:56px}.nav-i span{display:none}.nav-i{padding:0;justify-content:center}}
.nav-i{display:flex;align-items:center;gap:16px;width:100%;height:44px;padding:0 16px;border:0;background:transparent;color:var(--text2);text-align:left}
.nav-i:hover{background:var(--hover)}
.nav-i.on{color:var(--pt);background:var(--sel);font-weight:500}
.st-main{flex:1;min-width:0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border-radius:2px;box-shadow:var(--z1);padding:16px}
.card h3{margin:0 0 2px;font-size:16px;font-weight:500}
.card .sub{margin:0 0 12px;color:var(--text2);font-size:13px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:48px;flex-wrap:wrap}
.srow .sl{min-width:0;flex:1 1 180px}.srow .sl b{display:block;font-weight:500}.srow .sl small{color:var(--text2);font-size:12px}
.srow .sc{display:flex;align-items:center;gap:12px;flex:0 1 260px;min-width:0}
.srow .sc>*{min-width:0}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;font-size:13px}.kv dt{color:var(--text2)}.kv dd{margin:0;word-break:break-all}
.swg{display:flex;flex-wrap:wrap;gap:12px}
.sw{width:40px;height:40px;border:0;border-radius:50%;box-shadow:var(--z1);color:#fff;display:grid;place-items:center}
.sw.on{box-shadow:var(--z3)}
.wg{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.wt{height:60px;border:0;border-radius:2px;box-shadow:var(--z1);position:relative;color:#fff;display:flex;align-items:flex-end;padding:4px 8px;font-size:11px;text-shadow:0 1px 2px rgba(0,0,0,.6);text-align:left}
.wt.on{outline:3px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border-radius:2px;box-shadow:var(--z1);overflow:hidden}
.seg button{border:0;background:var(--card);height:34px;padding:0 16px;color:var(--text2)}
.seg button.on{background:var(--primary);color:#fff}
.switch{position:relative;display:inline-block;width:40px;height:24px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;left:3px;right:3px;top:5px;height:14px;border-radius:7px;background:var(--text3);transition:background var(--anim)}
.switch i::after{content:"";position:absolute;left:-3px;top:-3px;width:20px;height:20px;border-radius:50%;background:#EEE;box-shadow:var(--z1);transition:transform var(--anim),background var(--anim)}
.switch input:checked+i{background:color-mix(in srgb,var(--primary) 55%,transparent)}
.switch input:checked+i::after{transform:translateX(18px);background:var(--primary)}
.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:3px}
input[type=range]{accent-color:var(--primary);width:100%;min-width:0}
.env-r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) 36px;gap:12px;align-items:center;margin-bottom:4px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--bar);margin:8px 0}
.bar i{display:block;height:100%;min-width:2px}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--text2)}.lg b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-bottom:8px}
.big div{background:var(--bar);padding:12px;border-radius:2px}.big b{display:block;font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}.big span{font-size:12px;color:var(--text2)}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;background:var(--bar)}
.pill.ok{background:#C8E6C9;color:#1B5E20}.pill.fb{background:#FFE0B2;color:#BF360C}
.tm{width:100%;border-collapse:collapse;font-size:13px}.tm th{text-align:left;font-weight:500;color:var(--text2);padding:8px;border-bottom:1px solid var(--divider);font-size:12px}.tm td{padding:6px 8px;border-bottom:1px solid var(--divider)}
.tmw{overflow-x:auto}
.fl-list{margin:0;padding:0;list-style:none}.fl-list li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--divider);font-size:13px}.fl-list li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.term{height:100%;overflow:auto;background:#1E1E1E;color:#E0E0E0;padding:8px 12px;font:13px/1.5 'Roboto Mono',ui-monospace,Menlo,Consolas,monospace;user-select:text;-webkit-user-select:text;cursor:text}
.term-out{white-space:pre-wrap;word-break:break-word}
.term-l{display:flex;align-items:baseline}
.term-p{color:#69F0AE;white-space:pre;flex:none}
.term-in{flex:1;min-width:0;background:transparent;border:0;outline:0;color:inherit;font:inherit;padding:0;caret-color:#fff}
.term .er{color:#FF8A80}.term .pm{color:#69F0AE}.term .dm{color:#90A4AE}
</style>
</head>

      card('設定の初期化', '外観・ウィンドウ・環境変数の設定を初期値に戻します。ファイルは変更されません。', h('button', { class: 'btn danger', html: ic('refresh', 18) + '<span>設定を初期化</span>', onclick: async () => { if (await confirmBox('設定の初期化', 'すべての設定を初期値に戻します。', '初期化', true)) { setS(JSON.parse(JSON.stringify(DEFAULTS))); go('about'); toast('設定を初期化しました'); } } })));
  }
  drawNav(); go(page);
}

/* =====================================================================
   K. タスクマネージャー (プロセス状態の一覧)
   ===================================================================== */
function mountTasks(win) {
  const wrap = h('div', { class: 'st-main', style: { height: '100%' } }); win.body.append(wrap); win.setTitle('タスク');
  function draw() {
    wrap.innerHTML = '';
    const tb = h('tbody');
    WM.wins.forEach(w => {
      const a = APPS[w.app];
      tb.append(h('tr', null, h('td', null, String(w.pid)), h('td', null, h('span', { style: { display: 'inline-flex', alignItems: 'center', gap: '8px' } }, h('span', { html: ic(a.icon, 18), style: { color: a.color, display: 'grid' } }), a.name)), h('td', { style: { maxWidth: '180px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' } }, w.title),
        h('td', null, ({ normal: '通常', max: '最大化', min: '最小化' })[w.state] + (WM.focused === w ? ' · 前面' : '')),
        h('td', null, h('button', { class: 'btn sm danger', onclick: () => WM.close(w) }, '終了'))));
    });
    wrap.append(card_('実行中のプロセス', WM.wins.size + ' 個のウィンドウ', h('div', { class: 'tmw' }, h('table', { class: 'tm' }, h('thead', null, h('tr', null, ['PID', 'アプリ', 'タイトル', '状態', ''].map(x => h('th', null, x)))), tb))));
    wrap.append(card_('システム', null, h('dl', { class: 'kv' }, h('dt', null, 'ストレージ'), h('dd', null, FS.mode === 'webcontainer' ? 'WebContainer FS' : '接続が必要です'), h('dt', null, 'Node.js'), h('dd', null, FS.nodeLabel()))));
  }
  const card_ = (t, sub, ...k) => h('section', { class: 'card' }, h('h3', null, t), sub ? h('p', { class: 'sub' }, sub) : null, ...k);
  win.cleanups.push(bus.on('wm', draw)); draw();
}

/* =====================================================================
   L. 起動
   ===================================================================== */
(async function init() {
  applySettings(); renderChip(); renderTasks();
  $('#startBtn').innerHTML = ic('apps', 26);
  $('#startBtn').addEventListener('click', () => toggleStart());
  $('#wcChip').addEventListener('click', () => WM.open('settings', { page: 'env' }));
  $('#clock').addEventListener('click', () => toast(new Date().toLocaleString('ja-JP', { dateStyle: 'full', timeStyle: 'short' })));
  setInterval(tickClock, 1000);
  const desk = $('#desktop');
  desk.addEventListener('pointerdown', e => { if (!e.target.closest('.win')) { WM.blur(); if (!e.target.closest('.dicon')) { iconSel = null; $('#icons').querySelectorAll('.dicon').forEach(x => x.classList.remove('sel')); } } });
  desk.addEventListener('contextmenu', e => {
    if (e.target.closest('.win') || e.target.closest('.dicon')) return;
    e.preventDefault();
    ctxMenu(e.clientX, e.clientY, [{ label: 'ファイルアプリを開く', icon: 'folder', run: () => WM.open('files') }, { label: '新しいテキストファイル', icon: 'newfile', run: () => newRootItem(false) }, { label: '新しいフォルダ', icon: 'newfolder', run: () => newRootItem(true) }, '-', { label: '壁紙を変更', icon: 'palette', run: () => WM.open('settings', { page: 'appearance' }) }, { label: '更新', icon: 'refresh', run: () => renderIcons() }]);
  });
  window.addEventListener('resize', () => { const b = WM.bounds(); WM.wins.forEach(w => { if (w.state === 'normal') { w.x = Math.max(0, Math.min(w.x, b.w - 80)); w.y = Math.max(0, Math.min(w.y, b.h - 40)); WM.place(w); } }); });
  await renderIcons();
  await FS.boot();
  renderChip(); bus.emit('status'); await renderIcons();
  if (FS.mode === 'webcontainer') toast('WebContainer に接続しました (Node ' + FS.nodeVer + ')');
  else toast('WebContainerに接続できません。npm run dev でCOOP/COEPヘッダー付きで起動してください');
  if (innerWidth < 700) WM.open('files');
  else { WM.open('files', {}, { x: 36, y: 28, w: 780, h: 480 }); WM.open('editor', { path: '/index.js' }, { x: 330, y: 110, w: 640, h: 430 }); }
})();

/* =====================================================================
   M. ターミナル (WebContainer接続時のみ実コマンドをspawn)
   ===================================================================== */
function mountTerminal(win) {
  let cwd = '/', hist = [], hi = 0, proc = null, busy = false;
  const out = h('div', { class: 'term-out' });
  const pr = h('span', { class: 'term-p' });
  const inp = h('input', { class: 'term-in', spellcheck: 'false', autocomplete: 'off', autocapitalize: 'off', 'aria-label': 'コマンド入力' });
  const box = h('div', { class: 'term', onclick: () => { if (!String(getSelection())) inp.focus(); } }, out, h('div', { class: 'term-l' }, pr, inp));
  win.body.append(box); win.setTitle('ターミナル');
  const setPrompt = () => { pr.textContent = (cwd === '/' ? '~' : '~' + cwd) + ' $ '; };
  const print = (t, cls) => { out.append(h('span', cls ? { class: cls } : null, t)); box.scrollTop = box.scrollHeight; };
  const abs = p => p.startsWith('/') ? norm(p) : join(cwd, p);
  const tok = l => (l.match(/"[^"]*"|'[^']*'|\S+/g) || []).map(t => (/^(".*"|'.*')$/.test(t) ? t.slice(1, -1) : t));
  const envObj = () => { const o = {}; S.env.forEach(e => { if (e.k) o[e.k] = e.v; }); return o; };
  const expand = t => t.replace(/\$([A-Za-z_]\w*)/g, (m, k) => envObj()[k] ?? '');
  const HELP = 'help / clear / pwd / cd / env / export KEY=VALUE\n' + (FS.wc ? 'その他のコマンド (ls, cat, node, npm など) は WebContainer 内でそのまま実行されます。\n' : 'WebContainerに接続すると実コマンドを実行できます。\n');
  print('WebContainer Desktop ターミナル (' + (FS.wc ? 'WebContainer / Node ' + FS.nodeVer : 'WebContainer未接続') + ')\n', 'dm'); print(HELP, 'dm');

  async function exec(line) {
    if (FS.mode !== 'webcontainer') { print('WebContainer未接続です。npm run dev とCOOP/COEPヘッダーを確認してください\n', 'er'); return; }
    const raw = tok(line).map(expand); if (!raw.length) return;
    let a = raw, redirect = null;
    const ri = a.findIndex(t => t === '>' || t === '>>');
    if (ri > 0 && a[ri + 1]) { redirect = { f: abs(a[ri + 1]), app: a[ri] === '>>' }; a = a.slice(0, ri); }
    const c = a[0], args = a.slice(1);
    let buf = '';
    const w = (t, cls) => { if (redirect && !cls) buf += t; else print(t, cls); };
    switch (c) {
      case 'help': print(HELP); return;
      case 'clear': out.innerHTML = ''; return;
      case 'pwd': print(cwd + '\n'); return;
      case 'cd': { const t = abs(args[0] || '/'); const e = await FS.entry(t); if (e && e.dir) cwd = t; else print('cd: ' + (args[0] || '') + ': ディレクトリがありません\n', 'er'); return; }
      case 'env': Object.entries(envObj()).forEach(([k, v]) => print(k + '=' + v + '\n')); return;
      case 'export': { args.forEach(x => { const i = x.indexOf('='); if (i > 0) { const k = x.slice(0, i), v = x.slice(i + 1), ex = S.env.find(e => e.k === k); if (ex) ex.v = v; else S.env.push({ k, v }); } }); setS({ env: S.env }); return; }
    }
    if (FS.wc) {
      try {
        const p = await FS.wc.spawn(c, args, { env: envObj(), cwd: rel(cwd) }); proc = p;
        p.output.pipeTo(new WritableStream({ write(d) { print(stripAnsi(d)); } }));
        const code = await p.exit; proc = null; if (code) print('[exit ' + code + ']\n', 'dm');
      } catch (e) { proc = null; print(c + ': ' + (e.message || 'コマンドを実行できません') + '\n', 'er'); }
      return;
    }
    try {
      switch (c) {
        case 'ls': { const t = abs(args.find(x => !x.startsWith('-')) || '.'); const l = (await FS.readdir(t)).sort((x, y) => (y.dir - x.dir) || x.name.localeCompare(y.name, 'ja', { numeric: true })); if (args.includes('-l')) l.forEach(e => w((e.dir ? 'd' : '-') + ' ' + String(e.dir ? '' : e.size).padStart(8) + ' ' + e.name + '\n')); else w(l.map(e => e.name + (e.dir ? '/' : '')).join('  ') + '\n'); break; }
        case 'cat': for (const f of args) w((await FS.readText(abs(f))).replace(/\n?$/, '\n')); break;
        case 'echo': w(a.slice(1).join(' ') + '\n'); break;
        case 'mkdir': for (const d of args.filter(x => !x.startsWith('-'))) await FS.mkdir(abs(d)); break;
        case 'touch': for (const f of args) { const t = abs(f); if (!(await FS.entry(t))) await FS.writeFile(t, ''); } break;
        case 'rm': for (const f of args.filter(x => !x.startsWith('-'))) await FS.rm(abs(f)); break;
        case 'mv': if (args.length < 2) throw new Error('使い方: mv <元> <先>'); { const to = abs(args[1]), e = await FS.entry(to); await FS.rename(abs(args[0]), e && e.dir ? join(to, basename(args[0])) : to); } break;
        case 'cp': if (args.length < 2) throw new Error('使い方: cp <元> <先>'); { const to = abs(args[1]), e = await FS.entry(to); await FS.writeFile(e && e.dir ? join(to, basename(args[0])) : to, await FS.readFile(abs(args[0]))); } break;
        case 'tree': { const root = abs(args[0] || '.'); const all = await FS.walk(root, 500); w(root + '\n'); all.forEach(e => w('  '.repeat(e.path.slice(root.length).split('/').filter(Boolean).length - 1) + '└ ' + e.name + (e.dir ? '/' : '') + '\n')); break; }
        case 'node': {
          if (args[0] === '-v' || args[0] === '--version') { w('v' + S.nodeVer + '.0.0\n'); break; }
          if (!args[0]) throw new Error('使い方: node <file.js>');
          busy = true; await runFile(abs(args[0]), (t, er) => print(t, er ? 'er' : null)); break;
        }
        default: print(c + ': コマンドが見つかりません (WebContainer接続後に実行できます)\n', 'er');
      }
      if (redirect) { let t = buf; if (redirect.app) { try { t = (await FS.readText(redirect.f)) + buf; } catch (e) { /* 新規作成 */ } } await FS.writeFile(redirect.f, t); }
    } catch (e) { print(c + ': ' + (e.message || e) + '\n', 'er'); }
  }
  async function complete() {
    const v = inp.value, m = v.match(/(\S*)$/), word = m ? m[1] : '';
    const dirPart = word.includes('/') ? word.slice(0, word.lastIndexOf('/') + 1) : '', base = word.slice(dirPart.length);
    try {
      const l = (await FS.readdir(abs(dirPart || '.'), true)).filter(e => e.name.startsWith(base));
      if (l.length === 1) inp.value = v.slice(0, v.length - word.length) + dirPart + l[0].name + (l[0].dir ? '/' : ' ');
      else if (l.length > 1) { print(pr.textContent + v + '\n', 'pm'); print(l.map(e => e.name + (e.dir ? '/' : '')).join('  ') + '\n', 'dm'); }
    } catch (e) { /* 補完なし */ }
  }
  inp.addEventListener('keydown', async e => {
    if (e.key === 'Enter') {
      e.preventDefault(); if (busy || proc) return;
      const line = inp.value; inp.value = ''; print(pr.textContent, 'pm'); print(line + '\n');
      if (line.trim()) { hist.push(line); hi = hist.length; }
      busy = true; inp.disabled = true; try { await exec(line); } finally { busy = false; inp.disabled = false; setPrompt(); inp.focus(); box.scrollTop = box.scrollHeight; }
    } else if (e.key === 'ArrowUp') { e.preventDefault(); if (hi > 0) inp.value = hist[--hi]; }
    else if (e.key === 'ArrowDown') { e.preventDefault(); inp.value = hi < hist.length - 1 ? hist[++hi] : (hi = hist.length, ''); }
    else if (e.key === 'Tab') { e.preventDefault(); complete(); }
    else if (e.ctrlKey && e.key.toLowerCase() === 'l') { e.preventDefault(); out.innerHTML = ''; }
    else if (e.ctrlKey && e.key.toLowerCase() === 'c') { if (proc) { e.preventDefault(); try { proc.kill(); } catch (x) { /* 無視 */ } print('^C\n', 'dm'); } }
  });
  win.onClose = async () => { if (proc) { try { proc.kill(); } catch (e) { /* 無視 */ } } return true; };
  setPrompt(); setTimeout(() => inp.focus(), 50);
}
